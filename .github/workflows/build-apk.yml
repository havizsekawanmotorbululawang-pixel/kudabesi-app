name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Siapkan Web Assets
        run: |
          mkdir -p www
          cp index.html www/
          cp qris.png www/ || true

      - name: Pasang Capacitor & Generate Android
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "KudaBesi" "com.kudabesi.ojol" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: KudaBesi-Ojol-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
