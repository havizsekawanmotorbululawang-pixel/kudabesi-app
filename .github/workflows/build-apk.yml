name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Siapkan Web Assets & Konfigurasi
        run: |
          mkdir -p www
          cp index.html www/
          cp qris.png www/ 2>/dev/null || true
          
          # Buat package.json otomatis
          cat << 'EOF' > package.json
          {
            "name": "kudabesi-app",
            "version": "1.0.0",
            "private": true
          }
          EOF

          # Pasang Capacitor versi stabil
          npm install --save @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4

          # Buat konfigurasi Capacitor
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.kudabesi.ojol",
            "appName": "KudaBesi",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          # Generate folder Android tanpa prompt interaktif
          npx cap add android

      - name: Build APK dengan Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload File APK Jadi
        uses: actions/upload-artifact@v4
        with:
          name: KudaBesi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
